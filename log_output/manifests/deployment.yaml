apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          emptyDir: {}
          
        - name: file-volume
          configMap:
            name: file-config
            items:
              - key: information.txt
                path: information.txt

      containers:
        - name: log-writer
          image: log-writer:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/shared

        - name: log-reader
          image: log-reader:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: env-config
                  key: MESSAGE

          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/shared

            - name: file-volume
              mountPath: /usr/src/app/config