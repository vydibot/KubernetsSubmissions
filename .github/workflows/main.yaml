name: Release application

on:
  push:
    branches:
      - main
    tags:
      - '*'

env:
  PROJECT_ID: dwk-gke-505002
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: us-central1-a
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: todo-repo

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          location: '${{ env.GKE_ZONE }}'
          project_id: '${{ env.PROJECT_ID }}'

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Form Image Tags
        run: |
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }}" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}" >> $GITHUB_ENV
          echo "BROADCASTER_IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/broadcaster:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and Push Frontend
        run: |
          docker build --platform linux/amd64 -t $FRONTEND_IMAGE ./the_project/usr/scr/app/frontend
          docker push $FRONTEND_IMAGE

      - name: Build and Push Backend
        run: |
          docker build --platform linux/amd64 -t $BACKEND_IMAGE ./the_project/usr/scr/app/backend
          docker push $BACKEND_IMAGE

      - name: Build and Push Broadcaster
        run: |
          docker build --platform linux/amd64 -t $BROADCASTER_IMAGE ./the_project/usr/scr/app/broadcaster
          docker push $BROADCASTER_IMAGE

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Select deployment environment
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "DEPLOYMENT_ENV=staging" >> "$GITHUB_ENV"
            echo "NAMESPACE=staging" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "DEPLOYMENT_ENV=production" >> "$GITHUB_ENV"
            echo "NAMESPACE=production" >> "$GITHUB_ENV"
          else
            echo "Unsupported ref: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Deploy to GKE
        run: |
          echo "Deploying $GITHUB_SHA to $DEPLOYMENT_ENV ($NAMESPACE)"
          (cd the_project && \
            kustomize edit set image server-port=$FRONTEND_IMAGE && \
            kustomize edit set image todo-backend=$BACKEND_IMAGE && \
            kustomize edit set image todo-broadcaster=$BROADCASTER_IMAGE)
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k "deploy/overlays/$DEPLOYMENT_ENV"
          kubectl rollout status deployment/server-port -n "$NAMESPACE"
          kubectl rollout status deployment/todo-backend-dep -n "$NAMESPACE"
          kubectl rollout status deployment/todo-broadcaster-dep -n "$NAMESPACE"
          kubectl get services -n "$NAMESPACE" -o wide