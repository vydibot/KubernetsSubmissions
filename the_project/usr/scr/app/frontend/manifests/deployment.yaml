apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-port
  namespace: project
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server-port
  template:
    metadata:
      labels:
        app: server-port
    spec:
      volumes:
        - name: imagesave
          persistentVolumeClaim:
            claimName: image-pvc
      containers:
        - name: server-port
          image: us-central1-docker.pkg.dev/dwk-gke-505002/todo-repo/frontend:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: BACKEND_URL
              value: "http://todo-backend-svc.project.svc.cluster.local:8000"
          envFrom:
            - configMapRef:
                name: todo-app-config
          volumeMounts:
            - name: imagesave
              mountPath: /app/images