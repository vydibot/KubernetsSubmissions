apiVersion: batch/v1
kind: CronJob
metadata:
  name: wiki-todo-cronjob
  namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: wiki-todo-generator
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - |
                  WIKI_URL=$(curl -s -L -w "%{url_effective}" -o /dev/null "https://en.wikipedia.org/wiki/Special:Random")
                  
                  TODO_TEXT="Read $WIKI_URL"
                  echo "Generated todo: $TODO_TEXT"
                  
                  curl -s -f -X POST "http://todo-backend-svc.project.svc.cluster.local:8000/todos" \
                    -H "Content-Type: application/json" \
                    -d "{\"text\": \"$TODO_TEXT\"}"
          restartPolicy: OnFailure